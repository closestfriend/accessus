[project]
name = "tessera"
version = "0.1.0"
description = "Multi-agent access-control simulation that generates labeled security datasets"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
tessera = "tessera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
